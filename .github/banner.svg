<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'Bricolage Grotesque','Inter',Arial,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F4F4EF" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="#0D0D0C"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <text x="72" y="96" fill="#C8F53B" font-family="'JetBrains Mono',monospace" font-size="18" letter-spacing="3">// CUSTOM SOFTWARE &amp; DIGITAL STUDIO</text>
  <text x="68" y="200" fill="#F4F4EF" font-size="112" font-weight="800" letter-spacing="-4">LIVORA<tspan fill="#C8F53B">.</tspan></text>
  <text x="72" y="256" fill="#F4F4EF" fill-opacity="0.72" font-size="30" font-weight="500">From problem to working software.</text>
  <text x="72" y="306" fill="#F4F4EF" fill-opacity="0.45" font-family="'JetBrains Mono',monospace" font-size="16" letter-spacing="2">WEB  •  ANDROID  •  AUTOMATION  •  DESIGN</text>

  <!-- the "system builds itself" pipeline from the hero -->
  <g font-family="'JetBrains Mono',monospace" font-size="14">
    <line x1="860" y1="70" x2="860" y2="300" stroke="#F4F4EF" stroke-opacity="0.15" stroke-dasharray="4 6"/>
    <g fill="#F4F4EF" fill-opacity="0.55">
      <circle cx="860" cy="70" r="6" fill="#C8F53B" fill-opacity="1"/><text x="884" y="75">Architecture</text>
      <circle cx="860" cy="116" r="6" fill="#C8F53B" fill-opacity="1"/><text x="884" y="121">Database</text>
      <circle cx="860" cy="162" r="6" fill="#C8F53B" fill-opacity="1"/><text x="884" y="167">API</text>
      <circle cx="860" cy="208" r="6" fill="#C8F53B" fill-opacity="1"/><text x="884" y="213">Frontend</text>
      <circle cx="860" cy="254" r="6" fill="none" stroke="#C8F53B" stroke-width="2"/><text x="884" y="259">Mobile</text>
      <circle cx="860" cy="300" r="6" fill="none" stroke="#F4F4EF" stroke-opacity="0.4" stroke-width="2"/><text x="884" y="305">Production</text>
    </g>
    <rect x="1010" y="196" width="118" height="28" rx="14" fill="#C8F53B"/>
    <text x="1069" y="215" fill="#0D0D0C" text-anchor="middle" font-weight="600">building…</text>
  </g>
</svg>
